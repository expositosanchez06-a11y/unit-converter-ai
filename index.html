<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor de Unidades - AI Partner</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Celsius a Fahrenheit</h2>
    <input type="number" id="celsius" placeholder="Grados Celsius" oninput="convertir()">
    <p id="resultado">Resultado: -- °F</p>
</div>

<script>
    function convertir() {
        const celsius = document.getElementById('celsius').value;
        const fahrenheit = (celsius * 9/5) + 32;
        document.getElementById('resultado').innerText =
            celsius ? `Resultado: ${fahrenheit.toFixed(2)} °F` : "Resultado: -- °F";
    }
</script>
</body>
</html>
